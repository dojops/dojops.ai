server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Limit request body size (static site needs no uploads)
    client_max_body_size 1k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (applied to all responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com/gtag/js; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.npmjs.org https://registry.npmjs.org https://hub.dojops.ai https://api.dojops.ai https://www.google-analytics.com https://analytics.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Custom error pages
    error_page 400 401 403 405 408 413 414 429 500 502 503 504 /error.html;
    location = /error.html {
        internal;
    }

    error_page 404 /404.html;

    # Block sensitive paths
    location ~ ^/(\.env|\.git|server-status|nginx_status|phpinfo|wp-login|wp-admin|\.well-known/acme-challenge) {
        return 404;
    }

    # Static routing (not SPA — proper 404 on missing pages)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Immutable hashed assets (1 year cache)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com/gtag/js; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.npmjs.org https://registry.npmjs.org https://hub.dojops.ai https://api.dojops.ai https://www.google-analytics.com https://analytics.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Block dotfiles (e.g. .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }
}
